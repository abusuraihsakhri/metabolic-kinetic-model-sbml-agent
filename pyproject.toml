[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "metabolic-kinetic-model-sbml-engine"
version = "2.0.0"
description = "SBML-Kinetics: Kinetic Systems Biology Model ODE Solver Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
metabolic-kinetic-model-sbml-engine = "sbml_kinetics.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/metabolic-kinetic-model-sbml-engine"
Repository = "https://github.com/abusuraihsakhri/metabolic-kinetic-model-sbml-engine.git"
