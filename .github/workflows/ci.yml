name: Python and browser checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      AUDIT_SECRET_KEY: "CI-only-audit-key-not-used-in-production"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]' build
      - name: Python syntax and test suite
        run: |
          python -m compileall -q agents sbml_kinetics cli.py enrichment.py
          python -m pytest -q
      - name: Audit-chain regression
        run: |
          python -c "from agents.base import AuditTrail; a=AuditTrail(); a.log('ci','test','SMOKE',{'value':1}); assert a.verify_integrity()"
      - name: Browser JavaScript checks
        run: |
          node --check web/app.js
          node --test web/app.test.mjs
      - name: Build Python package
        run: python -m build
